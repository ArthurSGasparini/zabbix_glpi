services:
  # ==============================
  # STACK GLPI
  # ==============================
  glpi-db:
    image: mariadb:10.11
    container_name: glpi-db
    environment:
      - MYSQL_ROOT_PASSWORD=${GLPI_DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${GLPI_DB_DATABASE}
      - MYSQL_USER=${GLPI_DB_USER}
      - MYSQL_PASSWORD=${GLPI_DB_PASSWORD}
    volumes:
      - ./db-glpi-data:/var/lib/mysql
    networks:
      - ti-network
    restart: unless-stopped

  glpi:
    image: diouxx/glpi:latest
    container_name: glpi
    ports:
      - "80:80"
    environment:
      - TIMEZONE=${GLPI_TIMEZONE}
    volumes:
      - ./glpi-data:/var/www/html/glpi
    depends_on:
      - glpi-db
    networks:
      - ti-network
    restart: unless-stopped

  # ==============================
  # STACK ZABBIX
  # ==============================
  zabbix-db:
    image: mariadb:10.11
    container_name: zabbix-db
    environment:
      - MYSQL_ROOT_PASSWORD=${ZABBIX_DB_ROOT_PASSWORD}
      - MYSQL_USER=${ZABBIX_DB_USER}
      - MYSQL_PASSWORD=${ZABBIX_DB_PASSWORD}
      - MYSQL_DATABASE=${ZABBIX_DB_DATABASE}
    volumes:
      - ./db-zabbix-data:/var/lib/mysql
    networks:
      - ti-network
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-mysql:alpine-7.0-latest
    container_name: zabbix-server
    environment:
      - DB_SERVER_HOST=zabbix-db
      - MYSQL_USER=${ZABBIX_DB_USER}
      - MYSQL_PASSWORD=${ZABBIX_DB_PASSWORD}
    ports:
      - "10051:10051"
    depends_on:
      - zabbix-db
    networks:
      - ti-network
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:alpine-7.0-latest
    container_name: zabbix-web
    environment:
      - DB_SERVER_HOST=zabbix-db
      - MYSQL_USER=${ZABBIX_DB_USER}
      - MYSQL_PASSWORD=${ZABBIX_DB_PASSWORD}
      - ZBX_SERVER_HOST=zabbix-server
      - PHP_TZ=${ZABBIX_TIMEZONE}
    ports:
      - "8081:8080"
    depends_on:
      - zabbix-server
    networks:
      - ti-network
    restart: unless-stopped

  zabbix-agent:
    image: zabbix/zabbix-agent:alpine-7.0-latest
    container_name: zabbix-agent
    environment:
      - ZBX_HOSTNAME=Zabbix server
      - ZBX_SERVER_HOST=zabbix-server
    networks:
      - ti-network
    restart: unless-stopped

networks:
  ti-network:
    driver: bridge